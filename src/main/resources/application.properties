spring.application.name=digitalfix-notify

# RabbitMQ - red Docker compartida
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:rabbitmq-1:5672,rabbitmq-2:5672}
spring.rabbitmq.username=${RABBITMQ_USER:digitalfix}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:Digitalfix#2026}

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# No usar retry automatico del contenedor:
# controlaremos los intentos de forma explicita
spring.rabbitmq.listener.simple.retry.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.health.rabbit.enabled=true